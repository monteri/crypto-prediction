  web:
    build: api/
    container_name: fastapi_app
    ports:
      - "${FASTAPI_PORT}:8000"
    env_file:
      - .env
    volumes:
      - .:/app
    working_dir: /app/api
    command: uvicorn main:app --host ${FASTAPI_HOST} --port 8000 --reload --reload-dir /app/api --reload-dir /app/api/routes
    

  crypto-producer:
    build: api/
    container_name: kafka_producer
    command: python start_producer.py
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    env_file:
      - .env
    

  crypto-consumer:
    build: api/
    container_name: kafka_consumer
    command: python start_consumer.py
    environment:
      - PYTHONUNBUFFERED=${PYTHONUNBUFFERED}
    env_file:
      - .env
    
